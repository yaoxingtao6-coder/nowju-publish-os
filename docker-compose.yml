services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nowju
      POSTGRES_PASSWORD: nowju
      POSTGRES_DB: nowju
    ports:
      - "5432:5432"
    volumes:
      - nowju_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - nowju_redis:/data

volumes:
  nowju_pg:
  nowju_redis:
